<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse sample homes in Virginia and Maryland by area, price, and property type with Shamim Wani Real Estate.">
  <title>Virginia &amp; Maryland Homes | Shamim Wani Real Estate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site-pages.css">
</head>
<body class="site-page" data-page="properties">
  <div id="siteHeader"></div>
  <main id="main" class="site-shell site-main">
    <section class="page-intro"><p class="page-eyebrow">A considered collection</p><h1>Find a home that feels like yours.</h1><p>Explore sample homes and published listings in Virginia and Maryland. Narrow the collection by area, budget, and home style.</p></section>
    <section class="page-section" aria-label="Filter homes">
      <div class="filter-panel">
        <div class="filter-field"><label for="filterArea">Area</label><select id="filterArea"><option value="">All areas</option></select></div>
        <div class="filter-field"><label for="filterMin">Minimum price</label><input id="filterMin" type="number" min="0" step="10000" inputmode="numeric" placeholder="$ Any"></div>
        <div class="filter-field"><label for="filterMax">Maximum price</label><input id="filterMax" type="number" min="0" step="10000" inputmode="numeric" placeholder="$ Any"></div>
        <div class="filter-field"><label for="filterType">Property type</label><select id="filterType"><option value="">Any type</option><option>Rowhouse</option><option>Condo</option><option>Detached</option><option>Townhouse</option></select></div>
        <div class="filter-actions"><button class="page-button-secondary" id="resetFilters" type="button">Reset</button></div>
      </div>
      <div class="listing-toolbar"><strong id="listingCount" aria-live="polite">Loading homes…</strong><button id="savedOnly" type="button" aria-pressed="false">♡ Saved homes</button></div>
      <div id="propertyGrid" class="property-grid" aria-live="polite"></div>
    </section>
  </main>
  <div id="siteFooter"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script>
  <script src="supabase-config.js"></script><script src="site-data.js"></script><script src="site-pages.js"></script>
</body>
</html>
